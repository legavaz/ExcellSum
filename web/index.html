<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtotals API — итоги в формулы Excel</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: system-ui, "Segoe UI", Arial, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
h1 { font-size: 1.35rem; margin-bottom: .25rem; }
.hint { color: #8a8a8a; font-size: .9rem; margin-top: 0; }
form { display: grid; gap: .8rem; margin: 1.25rem 0; }
label { display: grid; gap: .25rem; font-size: .9rem; }
input, select, button { font: inherit; padding: .45rem .6rem; border: 1px solid #8884; border-radius: 6px; background: transparent; color: inherit; }
.row { display: flex; gap: 1rem; flex-wrap: wrap; }
.row label { flex: 1 1 200px; }
.checks { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.checks label { display: flex; align-items: center; gap: .4rem; }
.checks input { width: auto; }
button { cursor: pointer; font-weight: 600; padding: .6rem 1rem; }
button:disabled { opacity: .6; cursor: progress; }
#status { margin-top: .25rem; min-height: 1.2em; }
#status.error { color: #d33; }
#status.ok { color: #2a2; }
#log { white-space: pre-wrap; background: #8881; padding: .75rem; border-radius: 6px; display: none; max-height: 16rem; overflow: auto; font-size: .85rem; }
#download { display: none; margin-top: .5rem; font-weight: 600; }
</style>
</head>
<body>
<h1>Замена итогов на формулы Excel</h1>
<p class="hint">Загрузите .xlsx из 1С и укажите колонки со значениями — статические итоги станут формулами =SUM(...), результат можно сразу скачать.</p>
<form id="form">
  <label>Файл .xlsx
    <input type="file" id="file" accept=".xlsx" required>
  </label>
  <p id="analysis" class="hint"></p>
  <div class="row">
    <label>Колонки со значениями
      <input id="columns" placeholder="пусто — определить автоматически">
    </label>
    <label>Колонка уровня
      <input id="level_column" placeholder="A (необязательно)">
    </label>
  </div>
  <div class="row">
    <label>Стиль итогов
      <select id="style">
        <option value="auto">auto — определить автоматически</option>
        <option value="top">top — итог сверху группы</option>
        <option value="bottom">bottom — итог снизу группы</option>
      </select>
    </label>
    <label>Лист
      <input id="sheet" placeholder="по умолчанию активный">
    </label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="grand_total"> Плоский отчёт (общий итог в последней строке)</label>
    <label><input type="checkbox" id="dry_run"> Только проверить (dry-run)</label>
  </div>
  <button type="submit" id="submit">Обработать</button>
</form>
<div id="status"></div>
<pre id="log"></pre>
<a id="download" download>Скачать результат</a>
<script>
const $ = (id) => document.getElementById(id);
const form = $('form');

$('file').addEventListener('change', analyzeFile);
$('sheet').addEventListener('change', () => {
  if ($('file').files[0]) analyzeFile();
});

async function analyzeFile() {
  const file = $('file').files[0];
  const info = $('analysis');
  if (!file) {
    info.textContent = '';
    return;
  }
  info.textContent = 'Анализ файла…';
  const data = new FormData();
  data.append('file', file);
  if ($('sheet').value.trim()) data.append('sheet', $('sheet').value.trim());
  if ($('level_column').value.trim()) data.append('level_column', $('level_column').value.trim());
  try {
    const response = await fetch('/analyze', { method: 'POST', body: data });
    if (!response.ok) {
      let detail = response.statusText;
      try { detail = (await response.json()).detail || detail; } catch (e) {}
      info.textContent = 'Не удалось разобрать файл: ' + detail;
      return;
    }
    const result = await response.json();
    $('grand_total').checked = result.grand_total;
    info.textContent = describe(result);
  } catch (error) {
    info.textContent = 'Ошибка анализа: ' + error;
  }
}

function describe(result) {
  const cols = result.value_columns.length ? result.value_columns.join(', ') : '—';
  if (!result.cells) {
    return 'Лист «' + result.sheet + '»: числовых итогов не найдено — проверьте файл или укажите колонки вручную.';
  }
  if (result.flat) {
    return 'Лист «' + result.sheet + '»: плоский отчёт без группировок, включён общий итог — строка ' +
      result.total_row + ', колонки ' + cols + '.';
  }
  return 'Лист «' + result.sheet + '»: найдено итоговых строк — ' + result.grouped_rows +
    ', колонки ' + cols + '.';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = $('status');
  const log = $('log');
  const link = $('download');
  const button = $('submit');
  log.style.display = 'none';
  log.textContent = '';
  link.style.display = 'none';
  status.className = '';
  status.textContent = 'Обработка…';
  button.disabled = true;

  const data = new FormData();
  data.append('file', $('file').files[0]);
  if ($('columns').value.trim()) data.append('columns', $('columns').value.trim());
  if ($('level_column').value.trim()) data.append('level_column', $('level_column').value.trim());
  data.append('style', $('style').value);
  if ($('sheet').value.trim()) data.append('sheet', $('sheet').value.trim());
  if ($('grand_total').checked) data.append('grand_total', 'true');
  if ($('dry_run').checked) data.append('dry_run', 'true');

  try {
    const response = await fetch('/convert', { method: 'POST', body: data });
    const type = response.headers.get('content-type') || '';

    if (!response.ok) {
      let detail = response.statusText;
      if (type.includes('application/json')) {
        try { detail = (await response.json()).detail || detail; } catch (e) {}
      }
      status.className = 'error';
      status.textContent = 'Ошибка ' + response.status + ': ' + detail;
      return;
    }

    if (type.includes('application/json')) {
      const body = await response.json();
      status.className = 'ok';
      status.textContent = 'Готово: dry-run, файл не создавался.';
      log.textContent = body.log || '';
      log.style.display = 'block';
      return;
    }

    const blob = await response.blob();
    const name = filenameFrom(response.headers.get('content-disposition')) || 'fixed.xlsx';
    link.href = URL.createObjectURL(blob);
    link.download = name;
    link.textContent = 'Скачать ' + name;
    link.style.display = 'inline-block';
    status.className = 'ok';
    status.textContent = 'Готово: ' + name;
    const encodedLog = response.headers.get('x-log-preview-b64');
    const preview = response.headers.get('x-log-preview');
    if (encodedLog) {
      log.textContent = decodeBase64(encodedLog);
      log.style.display = 'block';
    } else if (preview) {
      log.textContent = preview.split(' | ').join('\n');
      log.style.display = 'block';
    }
  } catch (error) {
    status.className = 'error';
    status.textContent = 'Ошибка сети: ' + error;
  } finally {
    button.disabled = false;
  }
});

function filenameFrom(header) {
  if (!header) return null;
  const encoded = /filename\*=utf-8''([^;]+)/i.exec(header);
  if (encoded) { try { return decodeURIComponent(encoded[1]); } catch (e) {} }
  const plain = /filename="?([^";]+)"?/i.exec(header);
  return plain ? plain[1] : null;
}

function decodeBase64(value) {
  try {
    const bytes = Uint8Array.from(atob(value), (ch) => ch.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  } catch (e) {
    return '';
  }
}
</script>
</body>
</html>
